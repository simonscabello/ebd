<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#2f5f53" />
        <title>Sem conexão · EBD</title>
        <style>
            body {
                margin: 0;
                min-height: 100svh;
                display: grid;
                place-items: center;
                background: #faf7f2;
                color: #2a2521;
                font-family: system-ui, sans-serif;
                padding: 24px;
                text-align: center;
            }
            img {
                width: 72px;
                height: 72px;
                border-radius: 18px;
            }
            h1 {
                font-family: Georgia, serif;
                font-size: 1.6rem;
                margin: 20px 0 8px;
            }
            p {
                color: #6b635a;
                max-width: 22rem;
                line-height: 1.5;
            }
            button {
                margin-top: 16px;
                border: 0;
                border-radius: 12px;
                background: #2f5f53;
                color: #fff;
                padding: 12px 20px;
                font-size: 1rem;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #1c1a17;
                    color: #eee9e2;
                }
                p {
                    color: #b5ada3;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="" />
            <h1>Você está sem conexão</h1>
            <p>
                Assim que a internet voltar, a EBD abre normalmente. Lições já
                baixadas em PDF continuam no seu aparelho.
            </p>
            <button type="button" onclick="location.reload()">
                Tentar de novo
            </button>
        </main>
    </body>
</html>
